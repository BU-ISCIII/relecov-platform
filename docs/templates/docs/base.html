{% extends "core/base.html" %}
{% load static %}

{% block content %}
{% include "core/sideMenuFuncionality.html" %}

{% block extra_css %}
<link href="{% static 'docs/css/relecov_documentation.css' %}" rel="stylesheet">
{% endblock %}

<section class="hero-animated d-flex font-primary">
    <div class="container docs position-relative">
        <!-- Page Wrapper -->
        <div id="wrapper">

            <!-- Sidebar -->
            {% include "docs/documentationSideBar.html" %}
            <!-- End of Sidebar -->

            <!-- Content Wrapper -->
            <div id="content-wrapper" class="d-flex flex-column">

                <!-- Main Content -->
                <div id="content docs">
                    <!-- Begin Page Content -->
                    <div class="row p-4 gx-5" style="text-align: left;">
                        <div class="col-sm-12 px-5">
                            <div class="markdown-body">
                                {{ html|safe }}
                            </div>
                        </div>
                    </div>   <!-- end row -->
                </div> <!-- End of Main Content -->
            </div> <!-- End Content wrapper-->
        </div> <!-- wrapper -->
    </div>  <!-- End container -->
</section>
{% endblock%}
