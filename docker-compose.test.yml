services:
  # BEGIN BU-ISCIII SERVICE: relecov-platform (django)
  relecov-platform:
    image: "${RELECOV_PLATFORM_IMAGE:-relecov-platform:local}"
    build:
      context: "."
      dockerfile: "Dockerfile"
      args:
        GIT_REVISION: ${GIT_REVISION:-current}
        # Safe committed test settings are available inside the build context.
        INSTALL_CONF: "conf/docker_test_settings.txt"
        USE_INSTALL_CONF_SECRET: "false"
        RENDER_DJANGO_SETTINGS: "true"
        APP_UID: ${RELECOV_PLATFORM_APP_UID:?RELECOV_PLATFORM_APP_UID is required}
        APP_GID: ${RELECOV_PLATFORM_APP_GID:?RELECOV_PLATFORM_APP_GID is required}
        APP_PORT: ${RELECOV_PLATFORM_APP_PORT:?RELECOV_PLATFORM_APP_PORT is required}
        APP_REPO_PATH: ${RELECOV_PLATFORM_REPO_PATH:?RELECOV_PLATFORM_REPO_PATH is required}
        APP_INSTALL_PATH: ${RELECOV_PLATFORM_INSTALL_PATH:?RELECOV_PLATFORM_INSTALL_PATH is required}
    restart: unless-stopped
    user: "${RELECOV_PLATFORM_APP_UID:?RELECOV_PLATFORM_APP_UID is required}:${RELECOV_PLATFORM_APP_GID:?RELECOV_PLATFORM_APP_GID is required}"
    environment:
      APP_MODE: dev
      INSTALL_PATH: ${RELECOV_PLATFORM_INSTALL_PATH:?RELECOV_PLATFORM_INSTALL_PATH is required}
      APP_INSTALL_PATH: ${RELECOV_PLATFORM_INSTALL_PATH:?RELECOV_PLATFORM_INSTALL_PATH is required}
      APP_PORT: ${RELECOV_PLATFORM_APP_PORT:?RELECOV_PLATFORM_APP_PORT is required}
      PROJECT_MODULE: "relecov_platform"
      DB_HOST: relecov-platform-db
      DB_PORT: ${RELECOV_PLATFORM_DB_PORT:?RELECOV_PLATFORM_DB_PORT is required}
      DB_NAME: ${RELECOV_PLATFORM_DB_NAME:?RELECOV_PLATFORM_DB_NAME is required}
      DB_USER: ${RELECOV_PLATFORM_DB_USER:?RELECOV_PLATFORM_DB_USER is required}
      DB_PASSWORD: ${RELECOV_PLATFORM_DB_PASSWORD:?RELECOV_PLATFORM_DB_PASSWORD is required}
      DJANGO_SECRET_KEY: ${RELECOV_PLATFORM_DJANGO_SECRET_KEY:?RELECOV_PLATFORM_DJANGO_SECRET_KEY is required}
      DJANGO_ALLOWED_HOSTS: ${RELECOV_PLATFORM_DJANGO_ALLOWED_HOSTS:?RELECOV_PLATFORM_DJANGO_ALLOWED_HOSTS is required}
    depends_on:
      relecov-platform-db:
        condition: service_healthy
    volumes:
      - relecov-platform_test_documents:${RELECOV_PLATFORM_INSTALL_PATH:?RELECOV_PLATFORM_INSTALL_PATH is required}/documents:z
      - relecov-platform_test_static:${RELECOV_PLATFORM_INSTALL_PATH:?RELECOV_PLATFORM_INSTALL_PATH is required}/static:z
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['APP_PORT'] + '/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "0.0.0.0:${RELECOV_PLATFORM_APP_PORT:?RELECOV_PLATFORM_APP_PORT is required}:${RELECOV_PLATFORM_APP_PORT:?RELECOV_PLATFORM_APP_PORT is required}"
    networks: [deployment_net]
  # END BU-ISCIII SERVICE: relecov-platform
  # BEGIN BU-ISCIII SERVICE: relecov-iskylims (django)
  relecov-iskylims:
    image: "${RELECOV_ISKYLIMS_IMAGE:-relecov-iskylims:local}"
    build:
      context: "../relecov-iskylims"
      dockerfile: "Dockerfile"
      args:
        GIT_REVISION: ${GIT_REVISION:-current}
        # Safe committed test settings are available inside the build context.
        INSTALL_CONF: "conf/docker_test_settings.txt"
        USE_INSTALL_CONF_SECRET: "false"
        RENDER_DJANGO_SETTINGS: "true"
        APP_UID: ${RELECOV_ISKYLIMS_APP_UID:?RELECOV_ISKYLIMS_APP_UID is required}
        APP_GID: ${RELECOV_ISKYLIMS_APP_GID:?RELECOV_ISKYLIMS_APP_GID is required}
        APP_PORT: ${RELECOV_ISKYLIMS_APP_PORT:?RELECOV_ISKYLIMS_APP_PORT is required}
        APP_REPO_PATH: ${RELECOV_ISKYLIMS_REPO_PATH:?RELECOV_ISKYLIMS_REPO_PATH is required}
        APP_INSTALL_PATH: ${RELECOV_ISKYLIMS_INSTALL_PATH:?RELECOV_ISKYLIMS_INSTALL_PATH is required}
    restart: unless-stopped
    user: "${RELECOV_ISKYLIMS_APP_UID:?RELECOV_ISKYLIMS_APP_UID is required}:${RELECOV_ISKYLIMS_APP_GID:?RELECOV_ISKYLIMS_APP_GID is required}"
    environment:
      APP_MODE: dev
      INSTALL_PATH: ${RELECOV_ISKYLIMS_INSTALL_PATH:?RELECOV_ISKYLIMS_INSTALL_PATH is required}
      APP_INSTALL_PATH: ${RELECOV_ISKYLIMS_INSTALL_PATH:?RELECOV_ISKYLIMS_INSTALL_PATH is required}
      APP_PORT: ${RELECOV_ISKYLIMS_APP_PORT:?RELECOV_ISKYLIMS_APP_PORT is required}
      PROJECT_MODULE: "iskylims"
      DB_HOST: relecov-iskylims-db
      DB_PORT: ${RELECOV_ISKYLIMS_DB_PORT:?RELECOV_ISKYLIMS_DB_PORT is required}
      DB_NAME: ${RELECOV_ISKYLIMS_DB_NAME:?RELECOV_ISKYLIMS_DB_NAME is required}
      DB_USER: ${RELECOV_ISKYLIMS_DB_USER:?RELECOV_ISKYLIMS_DB_USER is required}
      DB_PASSWORD: ${RELECOV_ISKYLIMS_DB_PASSWORD:?RELECOV_ISKYLIMS_DB_PASSWORD is required}
      DJANGO_SECRET_KEY: ${RELECOV_ISKYLIMS_DJANGO_SECRET_KEY:?RELECOV_ISKYLIMS_DJANGO_SECRET_KEY is required}
      DJANGO_ALLOWED_HOSTS: ${RELECOV_ISKYLIMS_DJANGO_ALLOWED_HOSTS:?RELECOV_ISKYLIMS_DJANGO_ALLOWED_HOSTS is required}
    depends_on:
      relecov-iskylims-db:
        condition: service_healthy
    volumes:
      - relecov-iskylims_test_documents:${RELECOV_ISKYLIMS_INSTALL_PATH:?RELECOV_ISKYLIMS_INSTALL_PATH is required}/documents:z
      - relecov-iskylims_test_static:${RELECOV_ISKYLIMS_INSTALL_PATH:?RELECOV_ISKYLIMS_INSTALL_PATH is required}/static:z
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['APP_PORT'] + '/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "0.0.0.0:${RELECOV_ISKYLIMS_APP_PORT:?RELECOV_ISKYLIMS_APP_PORT is required}:${RELECOV_ISKYLIMS_APP_PORT:?RELECOV_ISKYLIMS_APP_PORT is required}"
    networks: [deployment_net]
  # END BU-ISCIII SERVICE: relecov-iskylims
  # BEGIN BU-ISCIII ADDON: apache
  relecov-platform-apache:
    image: registry.access.redhat.com/ubi9/httpd-24:latest
    restart: unless-stopped
    depends_on:
      relecov-platform:
        condition: service_healthy
      relecov-iskylims:
        condition: service_healthy
      relecov-platform-nextstrain:
        condition: service_healthy
    ports:
      - "${APACHE_BIND_HOST:?APACHE_BIND_HOST is required}:${APACHE_PORT:?APACHE_PORT is required}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      # Test uses the same runtime-rendered configuration as production.
      - ./deployment/apache/00-logs.conf:/etc/httpd/conf.d/00-logs.conf:ro,z
      - ./deployment/apache/01-reverse-proxy.conf:/etc/httpd/conf.d/01-reverse-proxy.conf:ro,z
      - ./deployment/apache/02-server-status.conf:/etc/httpd/conf.d/02-server-status.conf:ro,z
      # Disposable log volume avoids writing test logs into production paths.
      - apache_test_logs:/var/log/httpd:z
      # GENERATED MULTI-APP MOUNTS: disposable test static/document volumes.
      - relecov-platform_test_static:${RELECOV_PLATFORM_INSTALL_PATH:?RELECOV_PLATFORM_INSTALL_PATH is required}/static:ro,z
      - relecov-platform_test_documents:${RELECOV_PLATFORM_INSTALL_PATH:?RELECOV_PLATFORM_INSTALL_PATH is required}/documents:ro,z
      - relecov-iskylims_test_static:${RELECOV_ISKYLIMS_INSTALL_PATH:?RELECOV_ISKYLIMS_INSTALL_PATH is required}/static:ro,z
      - relecov-iskylims_test_documents:${RELECOV_ISKYLIMS_INSTALL_PATH:?RELECOV_ISKYLIMS_INSTALL_PATH is required}/documents:ro,z
      # OPTIONAL APP MOUNTS belong in ADDONS.apache.MOUNTS.
    networks: [deployment_net]
  # END BU-ISCIII ADDON: apache
  # BEGIN BU-ISCIII ADDON: nextstrain
  relecov-platform-nextstrain:
    image: ${NEXTSTRAIN_IMAGE:-nextstrain:local}
    build:
      context: ${NEXTSTRAIN_BUILD_CONTEXT:-./nextstrain}
      dockerfile: ${NEXTSTRAIN_DOCKERFILE:-Dockerfile}
      args:
        MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-pk.REPLACE_WITH_MAPBOX_PUBLIC_TOKEN}
        MAPBOX_STYLE_OWNER: ${MAPBOX_STYLE_OWNER:-mapbox}
        MAPBOX_STYLE_ID: ${MAPBOX_STYLE_ID:-light-v11}
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: ${NEXTSTRAIN_PORT:-8100}
    ports:
      - "127.0.0.1:${NEXTSTRAIN_HOST_PORT:-8100}:${NEXTSTRAIN_PORT:-8100}"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['PORT'] + '/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - nextstrain_data:${NEXTSTRAIN_DATA_DIR:-/data}
      - /etc/localtime:/etc/localtime:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    networks: [deployment_net]
  # END BU-ISCIII ADDON: nextstrain
  # BEGIN BU-ISCIII ADDON: samba (test only)
  relecov-platform-samba:
    image: docker.io/dperson/samba:latest
    restart: unless-stopped
    command: '-S -s "ngs_data;/mnt/test_ngs_data;yes;yes;no;${SAMBA_USER:?SAMBA_USER is required};none;none;ngs data samba share" -u "${SAMBA_USER:?SAMBA_USER is required};${SAMBA_PASSWORD:?SAMBA_PASSWORD is required}" -p'
    volumes:
      - samba_test_data:/mnt:z
    networks: [deployment_net]
  # END BU-ISCIII ADDON: samba
  relecov-platform-db:
    image: docker.io/library/mysql:8.0
    environment:
      MYSQL_DATABASE: ${RELECOV_PLATFORM_DB_NAME:?RELECOV_PLATFORM_DB_NAME is required}
      MYSQL_USER: ${RELECOV_PLATFORM_DB_USER:?RELECOV_PLATFORM_DB_USER is required}
      MYSQL_PASSWORD: ${RELECOV_PLATFORM_DB_PASSWORD:?RELECOV_PLATFORM_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${RELECOV_PLATFORM_DB_ROOT_PASSWORD:?RELECOV_PLATFORM_DB_ROOT_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: [relecov-platform_test_db:/var/lib/mysql]
    networks: [deployment_net]
  relecov-iskylims-db:
    image: docker.io/library/mysql:8.0
    environment:
      MYSQL_DATABASE: ${RELECOV_ISKYLIMS_DB_NAME:?RELECOV_ISKYLIMS_DB_NAME is required}
      MYSQL_USER: ${RELECOV_ISKYLIMS_DB_USER:?RELECOV_ISKYLIMS_DB_USER is required}
      MYSQL_PASSWORD: ${RELECOV_ISKYLIMS_DB_PASSWORD:?RELECOV_ISKYLIMS_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${RELECOV_ISKYLIMS_DB_ROOT_PASSWORD:?RELECOV_ISKYLIMS_DB_ROOT_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: [relecov-iskylims_test_db:/var/lib/mysql]
    networks: [deployment_net]

networks:
  deployment_net:

volumes:
  relecov-platform_test_db:
  relecov-platform_test_documents:
  relecov-platform_test_static:
  relecov-iskylims_test_db:
  relecov-iskylims_test_documents:
  relecov-iskylims_test_static:
  apache_test_logs:
  nextstrain_data:
  samba_test_data:
