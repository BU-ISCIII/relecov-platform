# Apache reverse proxy configuration customized for the integrated RELECOV stack.
# container_install.sh renders the variables below into deployment/apache.

# ============================================================================
# RELECOV PLATFORM
# ============================================================================
<VirtualHost *:8080>
    ServerName ${APACHE_SERVER_NAME}

    ProxyRequests Off
    ProxyPreserveHost On
    AllowEncodedSlashes NoDecode
    RequestHeader set X-Forwarded-Proto "${APACHE_FORWARDED_PROTO}"
    RequestHeader set X-Forwarded-Port "${APACHE_FORWARDED_PORT}"
    RequestHeader set X-Forwarded-Host "${APACHE_SERVER_NAME}"

    LimitRequestBody ${APACHE_LIMIT_REQUEST_BODY}
    <IfModule security2_module>
        SecRequestBodyLimit ${APACHE_LIMIT_REQUEST_BODY}
        SecRequestBodyNoFilesLimit ${APACHE_LIMIT_REQUEST_BODY}
    </IfModule>

    ProxyPass /static/ !
    Alias /static/ "${APP_INSTALL_PATH}/static/"
    <Directory "${APP_INSTALL_PATH}/static">
        Require all granted
    </Directory>

    ProxyPass /documents/ !
    Alias /documents/ "${APP_INSTALL_PATH}/documents/"
    <Directory "${APP_INSTALL_PATH}/documents">
        Require all granted
    </Directory>

    ProxyPass / http://app:${APP_APP_PORT}/
    ProxyPassReverse / http://app:${APP_APP_PORT}/
    ProxyTimeout ${APACHE_PROXY_TIMEOUT}
    TimeOut ${APACHE_PROXY_TIMEOUT}

    CustomLog logs/relecov-platform-apache.access.log combined env=!forwarded
    CustomLog logs/relecov-platform-apache.access.log proxy env=forwarded
    ErrorLog logs/relecov-platform-apache.error.log
</VirtualHost>

